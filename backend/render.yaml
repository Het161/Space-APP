# Render blueprint for the orbitWx API.
# Deploy: New > Blueprint > point at this repo, rootDir is `backend`.
services:
  - type: web
    name: orbitwx-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      # Add your Vercel deployment URL here after the frontend goes live.
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://orbitwx.vercel.app
      - key: POWER_START_YEAR
        value: 1996
      - key: POWER_END_YEAR
        value: 2025
      - key: CACHE_TTL_SECONDS
        value: 86400
      - key: CACHE_MAX_ENTRIES
        value: 50
      - key: RATE_LIMIT
        value: 30/minute
      - key: DEBUG
        value: false
